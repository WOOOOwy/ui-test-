<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>粤食采 · 私域商城首页（v6 · 通栏轮播）</title>
<style>
  :root{
    --bg:#F1FAF1;
    --white:#fff;
    --green:#34ac40;
    --green-light:#E8F5E9;
    --green-soft:#F1FAF1;
    --red:#E53935;
    --orange:#F59E0B;
    --ink:#1A231B;
    --sub:#7B8A7C;
    --line:#EDF2ED;
    --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:linear-gradient(180deg,#E6F3E6 0%,#F7FBF7 35%,#FFFFFF 100%);color:var(--ink);font-size:14px;line-height:1.5}
  .phone{position:relative;width:375px;margin:0 auto;background:transparent;min-height:812px;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.08)}

  /* status bar */
  .statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:13px;font-weight:600;background:transparent;color:var(--ink)}
  .statusbar .right{display:flex;gap:5px;align-items:center}
  .statusbar svg{display:block}

  /* top row: warehouse + mini program capsule */
  .toprow{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:transparent}
  .addrbar{display:flex;align-items:center;gap:8px}
  .pill{font-size:12px;color:var(--green);border:1px solid var(--green);padding:3px 8px;border-radius:6px;font-weight:700;background:rgba(52,172,64,.08)}
  .addr{display:flex;align-items:center;gap:2px;font-size:13px;font-weight:600;color:var(--ink)}
  .addr svg{width:14px;height:14px;color:var(--sub)}
  .capsule{display:flex;align-items:center;border:1px solid #DDE3DD;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.75);height:30px;padding:0 4px}
  .capsule .dot{width:34px;height:100%;display:flex;align-items:center;justify-content:center;gap:2.5px}
  .capsule .dot i{width:3.5px;height:3.5px;border-radius:50%;background:var(--ink)}
  .capsule .sep{width:1px;height:18px;background:#E6E9E6}
  .capsule .min{width:34px;height:100%;display:flex;align-items:center;justify-content:center}
  .capsule .min i{width:12px;height:1.5px;background:var(--ink);border-radius:1px}
  .capsule .close{width:34px;height:100%;display:flex;align-items:center;justify-content:center}
  .capsule .close i{width:12px;height:12px;border:1.5px solid var(--ink);border-radius:50%}

  /* search */
  .searchwrap{padding:0 16px 10px;background:transparent}
  .search{display:flex;align-items:center;background:transparent;border-bottom:1px solid rgba(52,172,64,.15);padding:6px 2px}
  .search svg{flex:none;color:var(--sub);width:16px;height:16px}
  .search input{flex:1;border:none;background:transparent;font-size:13px;color:var(--ink);outline:none;padding-left:8px}
  .search input::placeholder{color:#8a9a8a}
  .search .go{background:var(--green);color:#fff;font-size:12px;padding:6px 14px;border-radius:14px;font-weight:600;margin-left:6px}

  /* ptr */
  .ptr{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--green);font-size:12px;gap:6px;transition:height .25s;background:transparent}
  .ptr.show{height:46px}
  .ptr .spin{width:16px;height:16px;border:2px solid var(--green);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .scroll{overflow-y:auto;max-height:calc(812px - 44px - 46px - 44px - 64px);padding-bottom:80px;background:linear-gradient(180deg,#F2FAF2 0%,#FFFFFF 50%,#F7FBF7 100%)}
  .scroll::-webkit-scrollbar{display:none}

  /* ============================================================
     BANNER — 通栏轮播（v6）：整屏通宽、无卡片框、无露边
     图片左右贴边铺满视口宽度，底部圆点浮层指示
     ============================================================ */
  .banner-wrap{position:relative;margin:10px 0 12px;background:transparent}
  .banner-stage{
    display:flex;
    overflow-x:auto;overflow-y:hidden;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .banner-stage::-webkit-scrollbar{display:none}
  .banner-slide{
    flex:0 0 100%;            /* 通栏：每张占满整个视口宽度 */
    height:200px;
    scroll-snap-align:center;
    scroll-snap-stop:always;
    position:relative;
    background:var(--white);
  }
.banner-slide img{width:100%;height:100%;object-fit:fill;display:block}
  .banner-dots{
    position:absolute;bottom:9px;left:50%;transform:translateX(-50%);
    display:flex;gap:6px;padding:4px 11px;border-radius:11px;
    background:rgba(0,0,0,.28);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  }
  .banner-dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.65);transition:all .25s ease}
  .banner-dots span.active{background:#fff;width:16px;border-radius:3px}

  /* trust strip */
  .trust{display:flex;justify-content:space-around;padding:10px 16px 12px;background:transparent}
  .trust .item{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--sub)}
  .trust .item svg{width:16px;height:16px;color:var(--green)}

  /* categories: 9 entries, 5 + 4 natural wrap */
  .cats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 6px;padding:2px 16px 12px;background:transparent}
  .cat{display:flex;flex-direction:column;align-items:center;gap:5px}
  .cat .ring{width:48px;height:48px;border-radius:50%;overflow:hidden;background:var(--white);display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
  .cat .ring img{width:100%;height:100%;object-fit:cover}
  .cat span{font-size:11px;color:var(--ink);text-align:center}

  /* section head */
  .sec-head{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;background:transparent}
  .sec-head .bar{width:4px;height:18px;border-radius:2px;background:var(--green)}
  .sec-head h3{font-size:17px;font-weight:800;color:var(--ink)}

  /* masonry grid: true css columns, natural waterfall */
  .grid{columns:2;column-gap:12px;padding:4px 16px 18px;background:transparent}
  .pcard{background:var(--white);border-radius:14px;overflow:hidden;border:1px solid var(--line);position:relative;display:flex;flex-direction:column;break-inside:avoid;margin-bottom:12px}
  .pcard .img{position:relative;background:#fff;height:150px;overflow:hidden}
  .pcard .img img{width:100%;height:100%}
  .pcard .img img.fit-cover{object-fit:cover}
  .pcard .img img.fit-contain{object-fit:contain;background:#F7FBF7}
  .pcard .img img.fit-fill{object-fit:fill}
  .pcard .tag{position:absolute;left:0;top:0;background:var(--green);color:#fff;font-size:10px;padding:7px 3px 7px 2px;border-radius:0 0 10px 0;writing-mode:vertical-rl;letter-spacing:1px;font-weight:700}
  .pcard .body{padding:10px 10px 12px;display:flex;flex-direction:column;gap:5px}
  .pcard .nm{font-size:15px;font-weight:700;color:var(--ink)}
  .pcard .unit{font-size:12px;color:var(--sub)}
  .pcard .discount-row{display:flex;align-items:center;gap:6px;margin-top:-2px}
  .pcard .discount{font-size:10px;color:var(--green);background:var(--green-light);padding:2px 6px;border-radius:6px;border:1px solid rgba(52,172,64,.15)}
  .pcard .origin{font-size:11px;color:var(--sub);text-decoration:line-through}
  .pcard .price-row{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
  .pcard .price{color:var(--red);font-weight:800;font-size:18px}
  .pcard .price small{font-size:11px;font-weight:600}
  .pcard .add{width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;border:none}
  .addfly{position:fixed;width:26px;height:26px;border-radius:50%;background:var(--green);z-index:99;pointer-events:none;transition:transform .7s cubic-bezier(.4,-0.2,.6,1),opacity .7s}

  /* tabbar */
  .tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:375px;height:64px;background:#fff;display:flex;z-index:40;border-top:1px solid var(--line)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--sub);font-size:10.5px;position:relative}
  .tab svg{width:22px;height:22px}
  .tab.on{color:var(--green)}
  .tab .badge{position:absolute;top:4px;right:calc(50% - 17px);background:var(--red);color:#fff;font-size:9px;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;font-weight:700}

  /* cart panel */
  .cart-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none}
  .cart-mask.show{display:block}
  .cart-panel{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);width:375px;background:#fff;border-radius:20px 20px 0 0;z-index:51;max-height:560px;overflow-y:auto;padding:16px 14px 20px;display:none}
  .cart-panel.show{display:block}
  .cart-panel h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .cart-panel .close{margin-left:auto;color:var(--sub);font-size:13px}
  .cart-item{display:flex;gap:10px;background:#F7F8F7;border-radius:14px;padding:10px;margin-bottom:10px;align-items:center}
  .cart-item img{width:54px;height:54px;border-radius:10px;object-fit:cover;flex:none}
  .cart-item .ci-nm{font-size:13px;font-weight:600}
  .cart-item .ci-pr{color:var(--red);font-weight:800;font-size:15px;margin-top:3px}
  .cart-item .stepper{margin-left:auto;display:flex;align-items:center;gap:10px}
  .cart-item .stepper button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--green);font-size:16px;line-height:1}
  .cart-empty{text-align:center;padding:40px 0}
  .cart-empty .ill{width:110px;height:110px;margin:0 auto 14px}
  .cart-empty p{color:var(--sub);font-size:13px;margin-bottom:16px}
  .cart-empty .cta{background:var(--green);color:#fff;border:none;padding:10px 26px;border-radius:22px;font-size:14px;font-weight:600}

  /* toast */
  .toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(33,48,31,.9);color:#fff;padding:10px 18px;border-radius:22px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:opacity .3s}
  .toast.show{opacity:1}

  /* skeleton */
  .skeleton{position:absolute;inset:0;background:linear-gradient(180deg,#E6F3E6 0%,#F7FBF7 60%,#FFFFFF 100%);z-index:60;padding:16px}
  .sk{background:linear-gradient(90deg,#e0e9e0 25%,#eef3ee 37%,#e0e9e0 63%);background-size:400% 100%;animation:sh 1.4s infinite;border-radius:10px}
  @keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
  .sk-row{display:flex;gap:11px;margin-bottom:12px}
  .sk-card{width:170px;height:230px}
  .hide{display:none!important}
</style>
</head>

  {img:'https://raw.githubusercontent.com/WOOOowy/ui-test-/main/assets/images/huangningmeng.png',nm:'黄柠檬',   unit:'斤', price:2.30, fit:'cover'},
  {img:'https://raw.githubusercontent.com/WOOOowy/ui-test-/main/assets/images/prod_strawberry.jpg',nm:'红颜草莓',   unit:'盒', price:29.90, fit:'contain'},
  {img:'https://raw.githubusercontent.com/WOOOowy/ui-test-/main/assets/images/prod_kiwi.jpg',    nm:'阳光金果猕猴桃',unit:'斤', price:22.80, fit:'cover'},
  {img:'https://raw.githubusercontent.com/WOOOowy/ui-test-/main/assets/images/prod_veg.jpg',     nm:'有机上海青',   unit:'斤', price:9.90, fit:'fill'},
  {img:'https://raw.githubusercontent.com/WOOOowy/ui-test-/main/assets/images/prod_pork.jpg',    nm:'猪前腿肉',     unit:'斤', price:16.80, fit:'cover'},
];

/* ============ Banner：通栏轮播 ============ */
const stage=document.getElementById('bannerStage');
const slides=[...stage.querySelectorAll('.banner-slide')];
const bannerDots=document.getElementById('bannerDots');
let bIdx=0, bTimer=null;
slides.forEach((_,i)=>{const d=document.createElement('span');if(i===0)d.className='active';bannerDots.appendChild(d);});
function bStep(){return stage.clientWidth;}   // 通栏：单步 = 整屏宽度
function bSetActive(i){
  bIdx=(i+slides.length)%slides.length;
  bannerDots.querySelectorAll('span').forEach((s,k)=>s.classList.toggle('active',k===bIdx));
}
function goBanner(i){bSetActive(i);stage.scrollTo({left:bIdx*bStep(),behavior:'smooth'});}
function startB(){stopB();bTimer=setInterval(()=>goBanner(bIdx+1),4000);}
function stopB(){if(bTimer)clearInterval(bTimer);}
bSetActive(0); stage.scrollLeft=0;
bannerDots.querySelectorAll('span').forEach((d,i)=>d.addEventListener('click',()=>{stopB();goBanner(i);startB();}));
let bT;
stage.addEventListener('scroll',()=>{clearTimeout(bT);bT=setTimeout(()=>{const i=Math.round(stage.scrollLeft/bStep());if(i!==bIdx)bSetActive(i);},120);},{passive:true});
stage.addEventListener('touchstart',stopB,{passive:true});
stage.addEventListener('touchend',startB,{passive:true});
startB();

/* masonry product cards */
const grid=document.getElementById('grid');
PRODUCTS.forEach((p,i)=>{
  const discountRow=p.discount?`<div class="discount-row"><span class="discount">${p.discount}</span><span class="origin">¥${p.origin.toFixed(2)}</span></div>`:'';
  grid.insertAdjacentHTML('beforeend', `
    <div class="pcard">
      <div class="img"><img src="${p.img}" alt="${p.nm}" class="fit-${p.fit}" onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/WOOOowy/ui-test-/main/assets/images/logo_yueshicai.png';this.className='fit-contain'"><span class="tag">采购</span></div>
      <div class="body">
        <div class="nm">${p.nm}</div>
        <div class="unit">${p.unit}</div>
        ${discountRow}
        <div class="price-row">
          <span class="price"><small>¥</small>${p.price.toFixed(2)}</span>
          <button class="add" data-i="${i}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg></button>
        </div>
      </div>
    </div>`);
});

let cart=[];
const badge=document.getElementById('cartBadge');
const cartBody=document.getElementById('cartBody');
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400);}
document.querySelectorAll('.add').forEach(b=>{
  b.addEventListener('click',e=>{
    const i=+b.dataset.i, p=PRODUCTS[i];
    const f=document.createElement('div');f.className='addfly';
    const r=b.getBoundingClientRect(), cr=document.getElementById('cartTab').getBoundingClientRect();
    f.style.left=r.left+'px';f.style.top=r.top+'px';
    document.body.appendChild(f);
    requestAnimationFrame(()=>{f.style.transform=`translate(${cr.left-r.left}px,${cr.top-r.top}px) scale(.3)`;f.style.opacity='0';});
    setTimeout(()=>f.remove(),720);
    const ex=cart.find(c=>c.i===i);
    if(ex)ex.qty++;else cart.push({i,qty:1,price:p.price,nm:p.nm,img:p.img});
    badge.textContent=cart.reduce((s,c)=>s+c.qty,0);badge.classList.remove('hide');
    badge.animate([{transform:'scale(1.5)'},{transform:'scale(1)'}],{duration:300});
    toast(`已加购 ${p.nm}`);
  });
});

const cartMask=document.getElementById('cartMask'),cartPanel=document.getElementById('cartPanel');
function renderCart(){
  if(cart.length===0){
    cartBody.innerHTML=`<div class="cart-empty">
      <svg class="ill" viewBox="0 0 110 110" fill="none" stroke="#9DB3A2" stroke-width="3"><circle cx="55" cy="45" r="28"/><path d="M35 45h40M55 25v40" stroke-linecap="round"/><path d="M20 85h70" stroke-linecap="round"/></svg>
      <p>采购车还是空的</p>
      <button class="cta" onclick="document.getElementById('cartMask').classList.remove('show');document.getElementById('cartPanel').classList.remove('show')">去逛店</button></div>`;
    return;
  }
  cartBody.innerHTML=cart.map(c=>`<div class="cart-item"><img src="${c.img}" onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/WOOOowy/ui-test-/main/assets/images/logo_yueshicai.png';this.className='fit-contain'"><div><div class="ci-nm">${c.nm}</div><div class="ci-pr">¥${(c.price*c.qty).toFixed(2)}</div></div><div class="stepper"><button onclick="chg(${c.i},-1)">−</button><span>${c.qty}</span><button onclick="chg(${c.i},1)">+</button></div></div>`).join('')+
    `<div style="text-align:center;margin-top:8px"><button class="cta" style="background:var(--green);color:#fff;border:none;padding:10px 30px;border-radius:22px;font-weight:600" onclick="toast('已提交采购单')">提交采购单</button></div>`;
}
function chg(i,d){const c=cart.find(x=>x.i===i);if(!c)return;c.qty+=d;if(c.qty<=0)cart=cart.filter(x=>x.i!==i);badge.textContent=cart.reduce((s,x)=>s+x.qty,0);if(cart.length===0)badge.classList.add('hide');renderCart();}
window.chg=chg;
document.getElementById('cartTab').addEventListener('click',()=>{renderCart();cartMask.classList.add('show');cartPanel.classList.add('show');});
document.getElementById('cartMask').addEventListener('click',()=>{cartMask.classList.remove('show');cartPanel.classList.remove('show');});
document.getElementById('cartClose').addEventListener('click',()=>{cartMask.classList.remove('show');cartPanel.classList.remove('show');});

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    if(t.dataset.tab==='cart')return;
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');
    if(t.dataset.tab!=='home')toast('「'+t.textContent.trim()+'」页面待设计');
  });
});

const ptr=document.getElementById('ptr'),scroll=document.getElementById('scroll');let startY=0,pull=0;
scroll.addEventListener('touchstart',e=>{if(scroll.scrollTop===0)startY=e.touches[0].clientY;});
scroll.addEventListener('touchmove',e=>{if(startY&&scroll.scrollTop===0){pull=e.touches[0].clientY-startY;if(pull>0&&pull<90){ptr.classList.add('show');ptr.style.height=pull+'px';}}});
scroll.addEventListener('touchend',()=>{if(pull>50){ptr.style.height='46px';setTimeout(()=>{ptr.classList.remove('show');ptr.style.height='';toast('已更新 3 个特价');},900);}else{ptr.classList.remove('show');ptr.style.height='';}startY=0;pull=0;});

setTimeout(()=>{document.getElementById('skeleton').classList.add('hide');},1300);
</script>
</body>
