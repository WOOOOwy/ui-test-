<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>一天膳事 · 商户自营司机登录（方案八 · 文字 logo）</title>
<style>
  :root{
    --bg:#F1FAF1;
    --white:#fff;
    --green:#34ac40;
    --green-light:#E8F5E9;
    --green-soft:#F1FAF1;
    --green-dark:#2A8E34;
    --green-deep:#175E22;
    --red:#E53935;
    --ink:#1A231B;
    --sub:#7B8A7C;
    --line:#EDF2ED;
    --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;
    display:flex;align-items:center;justify-content:center;min-height:100vh;
  }

  .phone{
    position:relative;width:375px;height:812px;margin:0 auto;
    background:var(--white);overflow:hidden;
    box-shadow:0 0 40px rgba(0,0,0,.08);
    display:flex;flex-direction:column;
  }

  /* 状态栏：淡绿头部 → 深色图标 */
  .statusbar{
    height:44px;display:flex;align-items:center;justify-content:space-between;
    padding:0 18px;font-size:13px;font-weight:600;
    background:transparent;color:#1A231B;position:absolute;top:0;left:0;right:0;z-index:10;
  }
  .statusbar .right{display:flex;gap:5px;align-items:center}
  .statusbar svg{display:block}

  /* ============ 淡绿品牌头部（不抢 logo，轻盈通透） ============ */
  .hero{
    flex:none;height:330px;
    background:linear-gradient(180deg,#F1FAF1 0%,#E8F5E9 45%,#FFFFFF 100%);
    padding:96px 22px 0;position:relative;overflow:hidden;color:#1A231B;text-align:center;
  }
  .hero::before{
    content:'';position:absolute;width:190px;height:190px;border-radius:50%;
    background:rgba(52,172,64,.08);top:-64px;right:-52px;
  }
  .hero::after{
    content:'';position:absolute;width:120px;height:120px;border-radius:50%;
    background:rgba(52,172,64,.05);bottom:-42px;left:-34px;
  }
  .brand{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
  .logo-text{
    height:84px;width:auto;max-width:450px;object-fit:contain;display:block;
    margin-bottom:7px;
  }
  .brand-name{font-size:17px;font-weight:700;letter-spacing:2px;margin-bottom:8px;color:#1A231B}
  .brand-sub{font-size:13px;color:#7B8A7C;letter-spacing:.6px}

  /* ============ 白色大圆角上滑面板（本方案核心形态：28px 上圆角「抽屉」） ============ */
  .sheet{
    flex:1;margin-top:-56px;position:relative;z-index:2;
    background:var(--white);border-radius:28px 28px 0 0;
    padding:30px 22px 0;display:flex;flex-direction:column;
  }

  /* 图标盒式输入：左侧带线性图标（区别于方案一的纯盒式、方案二的下划线） */
  .field{
    display:flex;align-items:center;height:52px;
    background:#F4F9F4;border:1px solid var(--line);border-radius:12px;
    padding:0 14px;margin-bottom:14px;transition:border-color .18s ease,background .18s ease;
  }
  .field:focus-within{border-color:var(--green);background:#fff}
  .field .ico{
    width:18px;height:18px;color:var(--green);flex:none;margin-right:10px;display:block;
  }
  .field .ico svg{width:100%;height:100%;display:block}
  .field .prefix{
    font-size:15px;font-weight:600;color:var(--ink);padding-right:11px;
    margin-right:11px;border-right:1px solid var(--line);flex:none;
  }
  .field input{
    flex:1;min-width:0;border:none;outline:none;background:transparent;
    font-size:15px;color:var(--ink);font-family:inherit;
  }
  .field input::placeholder{color:#A8B8A9;font-weight:400}

  .link-btn{
    flex:none;border:none;background:transparent;color:var(--green);
    font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
    padding-left:12px;border-left:1px solid var(--line);height:20px;
  }
  .link-btn:disabled{color:#A8B8A9;cursor:not-allowed}

  /* 协议勾选 */
  .agree{display:flex;align-items:flex-start;gap:8px;margin:8px 0 22px;cursor:pointer}
  .agree input{position:absolute;opacity:0;width:0;height:0}
  .cbx{
    flex:none;width:16px;height:16px;border-radius:4px;margin-top:2px;
    border:1.5px solid #CBD8CC;background:#fff;
    display:flex;align-items:center;justify-content:center;transition:all .18s ease;
  }
  .cbx svg{width:10px;height:10px;opacity:0;transition:opacity .18s ease}
  .agree input:checked + .cbx{background:var(--green);border-color:var(--green)}
  .agree input:checked + .cbx svg{opacity:1}
  .agree-txt{font-size:12px;color:var(--sub);line-height:1.55;flex:1}
  .agree-txt a{color:var(--green);text-decoration:none;font-weight:600}

  /* 主按钮：胶囊渐变 */
  .btn-main{
    width:100%;height:50px;border:none;border-radius:25px;
    background:linear-gradient(135deg,#46C152 0%,#34ac40 100%);
    color:#fff;font-size:16px;font-weight:700;letter-spacing:.5px;
    cursor:pointer;font-family:inherit;transition:opacity .18s ease;
  }
  .btn-main:disabled{background:#C6D8C7;color:#F2F7F2;cursor:not-allowed}

  /* 提示文案：与方案一/二保持一致的三条常驻说明之一 */
  .tip{margin-top:13px;text-align:center;font-size:12px;color:var(--sub)}

  /* 页脚 */
  .page-footer{flex:none;padding:22px 0 26px;text-align:center;margin-top:auto}
  .page-footer .tech{font-size:12px;color:#9DB39D;letter-spacing:.3px}
  .page-footer .version{margin-top:6px;font-size:11px;color:#A8B8A8;letter-spacing:.6px;font-family:"SF Mono",monospace}

  /* toast */
  .toast{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    background:rgba(33,48,31,.9);color:#fff;padding:10px 18px;border-radius:22px;
    font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:opacity .3s;
    max-width:280px;text-align:center;
  }
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="phone">

  <!-- 状态栏：淡绿头部 → 深色图标 -->
  <div class="statusbar">
    <span>9:41</span>
    <span class="right">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="#1A231B"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="4.5" width="3" height="7.5" rx="1"/><rect x="9" y="2" width="3" height="10" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#1A231B"><path d="M8 2.2C5.5 2.2 3.2 3.2 1.6 4.8L0 3.2C2 1 4.8-0.2 8-0.2s6 1.2 8 3.4l-1.6 1.6C12.8 3.2 10.5 2.2 8 2.2z"/><path d="M8 6.5c-1.7 0-3.2.7-4.3 1.8L2 6.7C3.4 5.3 5.5 4.4 8 4.4s4.6.9 6 2.3l-1.7 1.6C11.2 7.2 9.7 6.5 8 6.5z"/><circle cx="8" cy="11" r="1.8"/></svg>
      <svg width="26" height="12" viewBox="0 0 26 12" fill="#1A231B"><rect x="0" y="1" width="22" height="10" rx="2.5" fill="none" stroke="#1A231B"/><rect x="2" y="3" width="17" height="6" rx="1"/><rect x="23" y="4" width="2" height="4" rx="1"/></svg>
    </span>
  </div>

  <!-- 淡绿品牌头部 -->
  <div class="hero">
    <div class="brand">
      <img class="logo-text" src="assets/images/logo_ytss_rectangle.png" alt="一天膳事" onerror="this.style.display='none'">
      <div class="brand-name">司机端</div>
      <div class="brand-sub">商户自营司机登录</div>
    </div>
  </div>

  <!-- 白色大圆角上滑面板 -->
  <div class="sheet">
    <div class="field">
      <span class="ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.5 18.5h3" stroke-linecap="round"/></svg>
      </span>
      <span class="prefix">+86</span>
      <input id="phoneInput" type="tel" inputmode="numeric" maxlength="11" placeholder="请输入手机号">
    </div>

    <div class="field">
      <span class="ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l7.5 3v6c0 4.6-3.1 8.8-7.5 11-4.4-2.2-7.5-6.4-7.5-11V5z" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 12l2.2 2.2L15.5 10" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <input id="codeInput" type="tel" inputmode="numeric" maxlength="6" placeholder="请输入短信验证码">
      <button class="link-btn" id="codeBtn">获取验证码</button>
    </div>

    <label class="agree">
      <input type="checkbox" id="agreeInput">
      <span class="cbx">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5"><path d="M4 12.5l5.2 5.2L20 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="agree-txt">已阅读并同意<a href="#" class="doc">《用户服务协议》</a>和<a href="#" class="doc">《隐私政策》</a></span>
    </label>

    <button class="btn-main" id="submitBtn" disabled>注册 / 登录</button>
    <div class="tip">未注册的手机号，验证通过后将自动创建司机账号</div>

    <div class="page-footer">
      <div class="tech">一天膳事® 提供技术服务</div>
      <div class="version">v1.0.0</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
var toastTimer=null;
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove('show');},1600);
}

var phoneInput=document.getElementById('phoneInput');
var codeInput=document.getElementById('codeInput');
var codeBtn=document.getElementById('codeBtn');
var agreeInput=document.getElementById('agreeInput');
var submitBtn=document.getElementById('submitBtn');

phoneInput.addEventListener('input',function(){
  phoneInput.value=phoneInput.value.replace(/\D/g,'').slice(0,11);
  refresh();
});
codeInput.addEventListener('input',function(){
  codeInput.value=codeInput.value.replace(/\D/g,'').slice(0,6);
  refresh();
});
agreeInput.addEventListener('change',refresh);

function isPhone(){return /^1[3-9]\d{9}$/.test(phoneInput.value);}

function refresh(){
  submitBtn.disabled=!(isPhone()&&agreeInput.checked&&codeInput.value.length===6);
}

/* 获取验证码 + 60s 倒计时 */
var cdTimer=null,left=0;
codeBtn.addEventListener('click',function(){
  if(!isPhone()){
    toast('请输入正确的手机号');
    phoneInput.focus();
    return;
  }
  var masked=phoneInput.value.replace(/^(\d{3})\d{4}(\d{4})$/,'$1****$2');
  toast('验证码已发送至 '+masked);
  left=60;
  codeBtn.disabled=true;
  codeBtn.textContent=left+'s 后重发';
  clearInterval(cdTimer);
  cdTimer=setInterval(function(){
    left--;
    if(left<=0){
      clearInterval(cdTimer);
      codeBtn.disabled=false;
      codeBtn.textContent='重新获取';
    }else{
      codeBtn.textContent=left+'s 后重发';
    }
  },1000);
});

/* 提交 */
submitBtn.addEventListener('click',function(){
  if(submitBtn.disabled)return;
  toast('登录成功，正在进入司机工作台…');
});

/* 协议 / 客服热线（原型占位） */
document.querySelectorAll('.doc').forEach(function(a){
  a.addEventListener('click',function(e){
    e.preventDefault();e.stopPropagation();
    toast('「'+a.textContent+'」页面待设计');
  });
});
/* 热线入口已隐藏（如需恢复请同步恢复页脚 .help）
document.getElementById('hotline').addEventListener('click',function(e){
  e.preventDefault();
  toast('呼叫调度热线 0757-8888 8888');
});
*/
</script>
</body>
</html>
