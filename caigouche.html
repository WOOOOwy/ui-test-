<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>粤食采 · 采购车</title>
<style>
  :root{
    --bg:#F1FAF1;
    --white:#fff;
    --green:#34ac40;
    --green-light:#E8F5E9;
    --green-soft:#F1FAF1;
    --red:#E53935;
    --orange:#F59E0B;
    --ink:#1A231B;
    --sub:#7B8A7C;
    --line:#EDF2ED;
    --disable:#C8D2C8;
    --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:linear-gradient(180deg,#E6F3E6 0%,#F7FBF7 30%,#FFFFFF 100%);color:var(--ink);font-size:14px;line-height:1.5}
  .phone{position:relative;width:375px;margin:0 auto;background:transparent;height:812px;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.08);display:flex;flex-direction:column}

  /* status bar */
  .statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:13px;font-weight:600;background:transparent;color:var(--ink);flex:none}
  .statusbar .right{display:flex;gap:5px;align-items:center}
  .statusbar svg{display:block}

  /* page header */
  .page-header{flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 16px 10px;background:transparent}
  .page-header h1{font-size:20px;font-weight:800;color:var(--ink);letter-spacing:.5px}
  .capsule{display:flex;align-items:center;border:1px solid #DDE3DD;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.75);height:30px;padding:0 4px}
  .capsule .dot{width:34px;height:100%;display:flex;align-items:center;justify-content:center;gap:2.5px}
  .capsule .dot i{width:3.5px;height:3.5px;border-radius:50%;background:var(--ink)}
  .capsule .sep{width:1px;height:18px;background:#E6E9E6}
  .capsule .min{width:34px;height:100%;display:flex;align-items:center;justify-content:center}
  .capsule .min i{width:12px;height:1.5px;background:var(--ink);border-radius:1px}
  .capsule .close{width:34px;height:100%;display:flex;align-items:center;justify-content:center}
  .capsule .close i{width:12px;height:12px;border:1.5px solid var(--ink);border-radius:50%}

  /* address + edit row */
  .addr-row{flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px 12px}
  .addrbar{display:flex;align-items:center;gap:8px}
  .pill{font-size:12px;color:var(--green);border:1px solid var(--green);padding:3px 8px;border-radius:6px;font-weight:700;background:rgba(52,172,64,.08)}
  .addr{display:flex;align-items:center;gap:2px;font-size:13px;font-weight:600;color:var(--ink)}
  .addr svg{width:14px;height:14px;color:var(--sub)}
  .edit-btn{font-size:13px;color:var(--green);font-weight:700;padding:4px 10px;background:var(--green-light);border-radius:14px}

  /* cart list */
  .cart-list{flex:1;overflow-y:auto;padding:0 16px 136px}
  .cart-list::-webkit-scrollbar{display:none}
  .cart-card{display:flex;gap:12px;background:var(--white);border-radius:14px;border:1px solid var(--line);padding:12px;margin-bottom:10px;align-items:center}
  .check{width:22px;height:22px;border-radius:50%;border:1.5px solid #C8D2C8;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;transition:all .2s}
  .check svg{width:12px;height:12px;color:#fff;display:none}
  .check.on{border-color:var(--green);background:var(--green)}
  .check.on svg{display:block}
  .cart-card .img{width:74px;height:74px;border-radius:10px;overflow:hidden;flex:none;background:#F7FBF7}
  .cart-card .img img{width:100%;height:100%;display:block;object-fit:cover}
  .cart-card .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .cart-card .nm{font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cart-card .unit{font-size:12px;color:var(--sub)}
  .cart-card .price{color:var(--red);font-weight:800;font-size:15px}
  .cart-card .price small{font-size:11px;font-weight:600}
  .stepper{display:flex;align-items:center;gap:8px;flex:none}
  .stepper button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--green);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center}
  .stepper button:disabled{color:var(--disable);border-color:var(--line)}
  .stepper .num{width:26px;text-align:center;font-size:14px;font-weight:700;color:var(--ink)}
  .delete-btn{font-size:12px;color:#fff;background:#E53935;padding:6px 12px;border-radius:12px;margin-left:4px;display:none}
  .cart-card.editing .delete-btn{display:block}
  .cart-card.editing .stepper{display:none}

  /* empty */
  .empty{text-align:center;padding:60px 0 40px;color:var(--sub)}
  .empty svg{width:110px;height:110px;margin:0 auto 14px;display:block;stroke:#9DB3A2;stroke-width:2;fill:none}
  .empty p{font-size:14px;margin-bottom:16px}
  .empty .cta{background:var(--green);color:#fff;border:none;padding:10px 26px;border-radius:22px;font-size:14px;font-weight:600;text-decoration:none;display:inline-block}

  /* bottom settlement bar */
  .settle-bar{position:absolute;left:0;right:0;bottom:64px;height:58px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 12px 0 16px;z-index:30}
  .settle-bar .check-wrap{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
  .settle-bar .total{flex:1;text-align:right;font-size:14px;color:var(--ink);margin-right:12px}
  .settle-bar .total b{color:var(--red);font-size:20px;font-weight:800}
  .settle-bar .total small{font-size:12px;font-weight:600}
  .settle-btn{height:40px;padding:0 26px;border-radius:20px;border:none;background:var(--disable);color:#fff;font-size:15px;font-weight:700}
  .settle-btn.active{background:var(--green)}

  /* tabbar */
  .tabbar{position:absolute;bottom:0;left:0;right:0;height:64px;background:#fff;display:flex;z-index:40;border-top:1px solid var(--line)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--sub);font-size:10.5px;position:relative;text-decoration:none}
  .tab svg{width:22px;height:22px}
  .tab.on{color:var(--green)}
  .tab .badge{position:absolute;top:4px;right:calc(50% - 17px);background:var(--red);color:#fff;font-size:9px;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;font-weight:700}

  /* toast */
  .toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(33,48,31,.9);color:#fff;padding:10px 18px;border-radius:22px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:opacity .3s}
  .toast.show{opacity:1}

  /* skeleton */
  .skeleton{position:absolute;inset:0;background:linear-gradient(180deg,#E6F3E6 0%,#F7FBF7 60%,#FFFFFF 100%);z-index:60;padding:16px;display:flex;flex-direction:column}
  .sk{background:linear-gradient(90deg,#e0e9e0 25%,#eef3ee 37%,#e0e9e0 63%);background-size:400% 100%;animation:sh 1.4s infinite;border-radius:10px}
  @keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
  .sk-row{display:flex;gap:11px;margin-bottom:12px}
  .sk-card{height:90px;flex:1}
  .hide{display:none!important}
</style>
</head>
<body>
<div class="phone" id="phone">

  <div class="statusbar">
    <span>9:41</span>
    <span class="right">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="#34ac40"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="4.5" width="3" height="7.5" rx="1"/><rect x="9" y="2" width="3" height="10" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#34ac40"><path d="M8 2.2C5.5 2.2 3.2 3.2 1.6 4.8L0 3.2C2 1 4.8-0.2 8-0.2s6 1.2 8 3.4l-1.6 1.6C12.8 3.2 10.5 2.2 8 2.2z"/><path d="M8 6.5c-1.7 0-3.2.7-4.3 1.8L2 6.7C3.4 5.3 5.5 4.4 8 4.4s4.6.9 6 2.3l-1.7 1.6C11.2 7.2 9.7 6.5 8 6.5z"/><circle cx="8" cy="11" r="1.8"/></svg>
      <svg width="26" height="12" viewBox="0 0 26 12" fill="#34ac40"><rect x="0" y="1" width="22" height="10" rx="2.5" fill="none" stroke="#34ac40"/><rect x="2" y="3" width="17" height="6" rx="1"/><rect x="23" y="4" width="2" height="4" rx="1"/></svg>
    </span>
  </div>

  <!-- page header -->
  <div class="page-header">
    <h1>采购车</h1>
    <div class="capsule">
      <div class="dot"><i></i><i></i><i></i></div>
      <div class="sep"></div>
      <div class="min"><i></i></div>
      <div class="sep"></div>
      <div class="close"><i></i></div>
    </div>
  </div>

  <!-- address + edit -->
  <div class="addr-row">
    <div class="addrbar">
      <span class="pill">桂城仓</span>
      <span class="addr">环宇城 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </div>
    <div class="edit-btn" id="editBtn">编辑</div>
  </div>

  <!-- cart list -->
  <div class="cart-list" id="cartList">
    <!-- injected -->
  </div>

  <!-- settlement bar -->
  <div class="settle-bar">
    <div class="check-wrap" id="selectAllWrap">
      <span class="check" id="selectAllCheck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5 9-9" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span>全选</span>
    </div>
    <div class="total">合计 <small>¥</small><b id="totalPrice">0.00</b></div>
    <button class="settle-btn" id="settleBtn">结算</button>
  </div>

  <!-- tabbar -->
  <div class="tabbar">
    <a href="shouye.html" class="tab" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11l8-7 8 7" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9h12v-9" stroke-linejoin="round"/></svg>首页
    </a>
    <a href="suoyoushangpin.html" class="tab" data-tab="all">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>所有商品
    </a>
    <a href="caigouche.html" class="tab on" data-tab="cart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h2l2.5 12h11L21 7H6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.6" fill="currentColor" stroke="none"/><circle cx="18" cy="20" r="1.6" fill="currentColor" stroke="none"/></svg>采购车
      <span class="badge hide" id="cartBadge">0</span>
    </a>
    <a href="dingdan.html" class="tab" data-tab="order">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z" stroke-linejoin="round"/><path d="M9 8h6M9 12h6" stroke-linecap="round"/></svg>订单
    </a>
    <a href="wode.html" class="tab" data-tab="me">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6" stroke-linecap="round"/></svg>我的
    </a>
  </div>

  <div class="toast" id="toast"></div>

  <div class="skeleton" id="skeleton">
    <div class="sk" style="height:44px;border-radius:16px;margin-bottom:10px"></div>
    <div class="sk" style="height:48px;border-radius:24px;margin-bottom:14px"></div>
    <div class="sk-row"><div class="sk sk-card"></div></div>
    <div class="sk-row"><div class="sk sk-card"></div></div>
    <div class="sk-row"><div class="sk sk-card"></div></div>
  </div>

</div>

<script>
const FALLBACK = 'https://raw.githubusercontent.com/WOOOowy/ui-test-/main/assets/images/logo_yueshicai.png';

// initial cart data (read from localStorage, shared cross-page via "myCart")
let cart = JSON.parse(localStorage.getItem('myCart') || '[]');
let editing = false;

const cartList = document.getElementById('cartList');
const selectAllCheck = document.getElementById('selectAllCheck');
const totalPrice = document.getElementById('totalPrice');
const settleBtn = document.getElementById('settleBtn');
const editBtn = document.getElementById('editBtn');
const cartBadge = document.getElementById('cartBadge');

function imgError(img){img.onerror=null;img.src=FALLBACK;}
function saveCart(){ localStorage.setItem('myCart', JSON.stringify(cart)); }
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400);}

function updateBadge(){
  const total = cart.reduce((s,c)=>s+c.qty,0);
  cartBadge.textContent = total;
  cartBadge.classList.toggle('hide', total===0);
}

function format(n){return n.toFixed(2);}

function isAllSelected(){return cart.length>0 && cart.every(c=>c.selected);}

function updateTotal(){
  const total = cart.filter(c=>c.selected).reduce((s,c)=>s+c.price*c.qty,0);
  totalPrice.textContent = format(total);
  const selectedCount = cart.filter(c=>c.selected).length;
  settleBtn.classList.toggle('active', selectedCount>0);
  settleBtn.textContent = selectedCount>0 ? `结算(${selectedCount})` : '结算';
  selectAllCheck.classList.toggle('on', isAllSelected());
}

function renderCart(){
  updateBadge();
  if(cart.length===0){
    cartList.innerHTML = `<div class="empty">
      <svg viewBox="0 0 110 110"><circle cx="55" cy="45" r="28"/><path d="M35 45h40" stroke-linecap="round"/><path d="M55 25v40" stroke-linecap="round"/><path d="M20 85h70" stroke-linecap="round"/></svg>
      <p>采购车还是空的</p>
      <a href="suoyoushangpin.html" class="cta">去逛店</a>
    </div>`;
    updateTotal();
    return;
  }
  cartList.innerHTML = cart.map((c,i)=>`
    <div class="cart-card ${editing?'editing':''}">
      <span class="check ${c.selected?'on':''}" data-idx="${i}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5 9-9" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <div class="img"><img src="${c.img}" alt="${c.nm}" onerror="imgError(this)"></div>
      <div class="info">
        <div class="nm">${c.nm}</div>
        <div class="unit">${c.unit}</div>
        <div class="price"><small>¥</small>${format(c.price)}</div>
      </div>
      <div class="stepper">
        <button data-idx="${i}" data-d="-1" ${c.qty<=1?'disabled':''}>−</button>
        <span class="num">${c.qty}</span>
        <button data-idx="${i}" data-d="1">+</button>
      </div>
      <button class="delete-btn" data-idx="${i}">删除</button>
    </div>
  `).join('');

  // bind checkbox
  cartList.querySelectorAll('.check').forEach(ch=>{
    ch.addEventListener('click',()=>{
      const idx=+ch.dataset.idx;
      cart[idx].selected = !cart[idx].selected;
      saveCart();
      renderCart();
    });
  });
  // bind stepper
  cartList.querySelectorAll('.stepper button').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const idx=+btn.dataset.idx, d=+btn.dataset.d;
      cart[idx].qty += d;
      if(cart[idx].qty<=0) cart.splice(idx,1);
      saveCart();
      renderCart();
    });
  });
  // bind delete (edit mode)
  cartList.querySelectorAll('.delete-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const idx=+btn.dataset.idx;
      cart.splice(idx,1);
      saveCart();
      renderCart();
    });
  });
  updateTotal();
}

// select all
document.getElementById('selectAllWrap').addEventListener('click',()=>{
  const all = isAllSelected();
  cart.forEach(c=>c.selected=!all);
  saveCart();
  renderCart();
});

// edit mode
editBtn.addEventListener('click',()=>{
  editing = !editing;
  editBtn.textContent = editing ? '完成' : '编辑';
  renderCart();
});

// settle
settleBtn.addEventListener('click',()=>{
  const total = cart.filter(c=>c.selected).reduce((s,c)=>s+c.price*c.qty,0);
  if(total<=0){toast('请选择要结算的商品');return;}
  toast(`结算成功，共 ¥${format(total)}`);
});

// init
renderCart();
setTimeout(()=>{document.getElementById('skeleton').classList.add('hide');},1000);
</script>
</body>
</html>
