<title>粤食采 · 私域商城首页（背景改造测试：顶部局部渐变）</title>
<style>
  :root{
    --bg:#F1FAF1;
    --white:#fff;
    --green:#34ac40;
    --green-light:#E8F5E9;
    --green-soft:#F1FAF1;
    --red:#E53935;
    --orange:#F59E0B;
    --ink:#1A231B;
    --sub:#7B8A7C;
    --line:#EDF2ED;
    --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#FFFFFF;color:var(--ink);font-size:14px;line-height:1.5}
  .phone{position:relative;width:375px;margin:0 auto;background:#FFFFFF;min-height:812px;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.08)}

  /* ===== 背景改造：局部渐变层 =====
     渐变只铺页面顶部一条（高度由 JS 对齐到轮播 Banner 下沿，默认 290px 兜底），
     从品牌浅绿淡出为 #FFFFFF，到底即纯白；下面全部内容都坐在纯白底上。
     body / .phone 均改为纯白，顶部各区块背景保持 transparent 透出本层。 */
  .top-bg{position:absolute;top:0;left:0;right:0;height:290px;z-index:0;pointer-events:none;
    background:linear-gradient(180deg,#E1F2E5 0%,#EFF9F1 50%,#FFFFFF 100%)}

  /* status bar */
  .statusbar{position:relative;z-index:1;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:13px;font-weight:600;background:transparent;color:var(--ink)}
  .statusbar .right{display:flex;gap:5px;align-items:center}
  .statusbar svg{display:block}

  /* top row: warehouse + mini program capsule */
  .toprow{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:transparent}
  .addrbar{display:flex;align-items:center;gap:8px}
  .pill{font-size:12px;color:var(--green);border:1px solid var(--green);padding:3px 8px;border-radius:6px;font-weight:700;background:rgba(52,172,64,.08)}
  .addr{display:flex;align-items:center;gap:2px;font-size:13px;font-weight:600;color:var(--ink)}
  .addr svg{width:14px;height:14px;color:var(--sub)}
  .capsule{display:flex;align-items:center;border:1px solid #DDE3DD;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.75);height:30px;padding:0 4px}
  .capsule .dot{width:34px;height:100%;display:flex;align-items:center;justify-content:center;gap:2.5px}
  .capsule .dot i{width:3.5px;height:3.5px;border-radius:50%;background:var(--ink)}
  .capsule .sep{width:1px;height:18px;background:#E6E9E6}
  .capsule .min{width:34px;height:100%;display:flex;align-items:center;justify-content:center}
  .capsule .min i{width:12px;height:1.5px;background:var(--ink);border-radius:1px}
  .capsule .close{width:34px;height:100%;display:flex;align-items:center;justify-content:center}
  .capsule .close i{width:12px;height:12px;border:1.5px solid var(--ink);border-radius:50%}

  /* search */
  .searchwrap{position:relative;z-index:1;padding:0 16px 10px;background:transparent;flex:none}
  .search{display:flex;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:22px;padding:4px 4px 4px 12px}
  .search svg{flex:none;color:var(--sub);width:16px;height:16px}
  .search input{flex:1;border:none;background:transparent;font-size:13px;color:var(--ink);outline:none;padding-left:8px}
  .search input::placeholder{color:#8a9a8a}
  .search .go{background:var(--green);color:#fff;font-size:13px;padding:7px 16px;border-radius:18px;font-weight:600;margin-left:6px}

  /* ptr */
  .ptr{position:relative;z-index:1;height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--green);font-size:12px;gap:6px;transition:height .25s;background:transparent}
  .ptr.show{height:46px}
  .ptr .spin{width:16px;height:16px;border:2px solid var(--green);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .scroll{position:relative;z-index:1;overflow-y:auto;max-height:calc(812px - 44px - 46px - 44px - 64px);padding-bottom:80px;background:transparent}
  .scroll::-webkit-scrollbar{display:none}

  /* banner slider */
  .banner-wrap{margin:8px 16px 12px;position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:var(--white)}
  .banner-track{display:flex;transition:transform .35s ease}
  .banner-slide{flex:none;width:100%;height:140px;position:relative}
  .banner-slide img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
  .banner-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
  .banner-dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5)}
  .banner-dots span.active{background:var(--green)}

  /* trust strip */
  .trust{display:flex;justify-content:space-around;padding:10px 16px 12px;background:transparent}
  .trust .item{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--sub)}
  .trust .item svg{width:16px;height:16px;color:var(--green)}

  /* merchant code */
  .merchant{display:flex;align-items:center;gap:8px;padding:0 16px 10px}
  .merchant .code{font-size:11px;color:var(--green);background:rgba(52,172,64,.08);padding:4px 10px;border-radius:12px;border:1px solid rgba(52,172,64,.15)}

  /* categories: 9 entries, 5 + 4 natural wrap */
  .cats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 6px;padding:2px 16px 12px;background:transparent}
  .cat{display:flex;flex-direction:column;align-items:center;gap:5px}
  .cat .ring{width:48px;height:48px;border-radius:50%;overflow:hidden;background:var(--white);display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
  .cat .ring img{width:100%;height:100%;object-fit:cover}
  .cat span{font-size:11px;color:var(--ink);text-align:center}

  /* ===== 推荐商品模块 v15 重构 ===== */
  .reco{background:transparent;padding-bottom:4px}
  .sec-head{display:flex;align-items:flex-end;gap:8px;padding:16px 16px 12px;background:transparent}
  .sec-head .leaf{width:22px;height:22px;color:var(--green);flex:none}
  .sec-titles{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
  .sec-head h3{font-size:19px;font-weight:800;color:var(--ink);line-height:1.1}
  .sec-sub{font-size:11.5px;color:var(--sub)}
  .sec-more{font-size:12px;color:var(--green);font-weight:700;text-decoration:none;flex:none;padding-bottom:3px}

  /* 精选大卡 hero */
  .hero{margin:0 16px 14px;background:var(--white);border-radius:18px;overflow:hidden;border:1px solid var(--line);position:relative;box-shadow:0 6px 18px rgba(26,35,27,.06)}
  .hero-track{display:flex;transition:transform .35s ease}
  .hero-slide{min-width:100%;display:flex;box-sizing:border-box}
  .hero-img{width:140px;flex:none;height:140px;position:relative;background:#F7FBF7}
  .hero-img img{width:100%;height:100%;object-fit:cover;display:block}
  .hero-img .rec{position:absolute;left:8px;top:8px;display:flex;align-items:center;gap:3px;background:rgba(26,35,27,.5);color:#fff;font-size:10px;padding:3px 8px;border-radius:10px;font-weight:600;backdrop-filter:blur(2px)}
  .hero-img .rec svg{width:11px;height:11px}
  .hero-info{flex:1;padding:12px 12px 18px 14px;display:flex;flex-direction:column;gap:5px;min-width:0}
  .hero-tag{align-self:flex-start;font-size:10px;color:var(--green);background:var(--green-light);border:1px solid rgba(52,172,64,.18);padding:2px 7px;border-radius:6px;font-weight:700}
  .hero-nm{font-size:16px;font-weight:800;color:var(--ink);line-height:1.25}
  .hero-meta{font-size:11.5px;color:var(--sub)}
  .hero-stat{font-size:11px;color:var(--orange);font-weight:700;display:flex;align-items:center;gap:4px}
  .hero-stat svg{width:12px;height:12px}
  .hero-bottom{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:4px}
  .hero-bottom .price{color:var(--red);font-weight:800;font-size:20px}
  .hero-bottom .price small{font-size:11px;font-weight:600;color:var(--sub)}
  .hero .add{width:32px;height:32px;border-radius:50%;background:var(--green);color:#fff;border:none;display:flex;align-items:center;justify-content:center;flex:none}
  .hero .add svg{width:16px;height:16px}
  .hero-dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:2}
  .hero-dots span{width:6px;height:6px;border-radius:50%;background:rgba(26,35,27,.25);transition:background .2s ease}
  .hero-dots span.active{background:var(--green)}

  /* 全部商品：CSS 瀑布流 */
  .grid{columns:2;column-gap:12px;padding:0 16px 18px;background:transparent}
  .pcard{background:var(--white);border-radius:14px;overflow:hidden;border:1px solid var(--line);position:relative;display:flex;flex-direction:column;break-inside:avoid;margin-bottom:12px}
  .pcard .img{position:relative;background:#fff;height:150px;overflow:hidden}
  .pcard .img img{width:100%;height:100%}
  .pcard .img img.fit-cover{object-fit:cover}
  .pcard .img img.fit-contain{object-fit:contain;background:#F7FBF7}
  .pcard .img img.fit-fill{object-fit:fill}
  .pcard .procure{position:absolute;left:0;top:0;background:var(--green);color:#fff;font-size:10px;padding:7px 3px 7px 2px;border-radius:0 0 10px 0;writing-mode:vertical-rl;letter-spacing:1px;font-weight:700}
  .pcard .body{padding:10px 10px 12px;display:flex;flex-direction:column;gap:5px}
  .pcard .nm{font-size:15px;font-weight:700;color:var(--ink)}
  .pcard .unit{font-size:12px;color:var(--sub)}
  .pcard .tag-row{display:flex;align-items:center;gap:6px;margin-top:-2px;min-height:0}
  .pcard .tag-pill{font-size:10px;color:var(--green);background:var(--green-light);padding:2px 6px;border-radius:6px;border:1px solid rgba(52,172,64,.15);font-weight:700}
  .pcard .origin{font-size:11px;color:var(--sub);text-decoration:line-through}
  .pcard .price-row{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
  .pcard .price{color:var(--red);font-weight:800;font-size:18px}
  .pcard .price small{font-size:11px;font-weight:600}
  .pcard .add{width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;border:none}
  .addfly{position:fixed;width:26px;height:26px;border-radius:50%;background:var(--green);z-index:99;pointer-events:none;transition:transform .7s cubic-bezier(.4,-0.2,.6,1),opacity .7s}

  /* tabbar */
  .tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:375px;height:64px;background:#fff;display:flex;z-index:40;border-top:1px solid var(--line)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--sub);font-size:10.5px;position:relative;text-decoration:none}
  .tab svg{width:22px;height:22px}
  .tab.on{color:var(--green)}
  .tab .badge{position:absolute;top:4px;right:calc(50% - 17px);background:var(--red);color:#fff;font-size:9px;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;font-weight:700}

  /* cart panel */
  .cart-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none}
  .cart-mask.show{display:block}
  .cart-panel{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);width:375px;background:#fff;border-radius:20px 20px 0 0;z-index:51;max-height:560px;overflow-y:auto;padding:16px 14px 20px;display:none}
  .cart-panel.show{display:block}
  .cart-panel h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .cart-panel .close{margin-left:auto;color:var(--sub);font-size:13px}
  .cart-item{display:flex;gap:10px;background:#F7F8F7;border-radius:14px;padding:10px;margin-bottom:10px;align-items:center}
  .cart-item img{width:54px;height:54px;border-radius:10px;object-fit:cover;flex:none}
  .cart-item .ci-nm{font-size:13px;font-weight:600}
  .cart-item .ci-pr{color:var(--red);font-weight:800;font-size:15px;margin-top:3px}
  .cart-item .stepper{margin-left:auto;display:flex;align-items:center;gap:10px}
  .cart-item .stepper button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--green);font-size:16px;line-height:1}
  .cart-empty{text-align:center;padding:40px 0}
  .cart-empty .ill{width:110px;height:110px;margin:0 auto 14px}
  .cart-empty p{color:var(--sub);font-size:13px;margin-bottom:16px}
  .cart-empty .cta{background:var(--green);color:#fff;border:none;padding:10px 26px;border-radius:22px;font-size:14px;font-weight:600}

  /* toast */
  .toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(33,48,31,.9);color:#fff;padding:10px 18px;border-radius:22px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:opacity .3s}
  .toast.show{opacity:1}

  /* skeleton */
  .skeleton{position:absolute;inset:0;background:linear-gradient(180deg,#E1F2E5 0%,#EFF9F1 50%,#FFFFFF 100%);background-size:100% 290px;background-repeat:no-repeat;background-color:#FFFFFF;z-index:60;padding:16px}
  .sk{background:linear-gradient(90deg,#e0e9e0 25%,#eef3ee 37%,#e0e9e0 63%);background-size:400% 100%;animation:sh 1.4s infinite;border-radius:10px}
  @keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
  .sk-row{display:flex;gap:11px;margin-bottom:12px}
  .sk-card{width:170px;height:230px}
  .hide{display:none!important}
</style>
</head>

/* banner slider */
let bannerIdx=0;

BANNERS.forEach((_,i)=>{
  const d=document.createElement('span');
  if(i===0)d.className='active';
  bannerDots.appendChild(d);
});
function goBanner(i){
  bannerIdx=(i+BANNERS.length)%BANNERS.length;
  bannerTrack.style.transform='translateX('+(-bannerIdx*100)+'%)';
  bannerDots.querySelectorAll('span').forEach((s,idx)=>s.classList.toggle('active',idx===bannerIdx));
}
let bannerTimer=setInterval(()=>goBanner(bannerIdx+1),4000);
const bannerWrap=document.getElementById('bannerWrap');
let bannerStartX=0,bannerSwiping=false;
bannerWrap.addEventListener('touchstart',e=>{bannerStartX=e.touches[0].clientX;bannerSwiping=true;clearInterval(bannerTimer);},{passive:true});
bannerWrap.addEventListener('touchmove',e=>{if(!bannerSwiping)return;},{passive:true});
bannerWrap.addEventListener('touchend',e=>{
  if(!bannerSwiping)return;
  const dx=e.changedTouches[0].clientX-bannerStartX;
  if(dx<-40)goBanner(bannerIdx+1);
  else if(dx>40)goBanner(bannerIdx-1);
  bannerSwiping=false;
  bannerTimer=setInterval(()=>goBanner(bannerIdx+1),4000);
},{passive:true});
bannerDots.querySelectorAll('span').forEach((d,i)=>d.addEventListener('click',()=>{clearInterval(bannerTimer);goBanner(i);bannerTimer=setInterval(()=>goBanner(bannerIdx+1),4000);}));

      f.style.left=r.left+'px';f.style.top=r.top+'px';
      document.body.appendChild(f);
      requestAnimationFrame(()=>{f.style.transform=`translate(${cr.left-r.left}px,${cr.top-r.top}px) scale(.3)`;f.style.opacity='0';});
      setTimeout(()=>f.remove(),720);
    }
    const ex=cart.find(c=>c.id===String(i));
    if(ex)ex.qty++;else cart.push({id:String(i),qty:1,price:p.price,nm:p.nm,img:p.img,unit:p.unit,selected:true});
    localStorage.setItem('myCart',JSON.stringify(cart));
    if(badge){badge.textContent=cart.reduce((s,c)=>s+c.qty,0);badge.classList.remove('hide');badge.animate([{transform:'scale(1.5)'},{transform:'scale(1)'}],{duration:300});}
    toast('已加购 '+p.nm);
  });
});

// search: filter product cards in place
function doSearch(){
  const kw=document.getElementById('searchInput').value.trim();
  const cards=[...document.querySelectorAll('.pcard')];
  let visible=0;
  cards.forEach(c=>{const show=!kw||c.dataset.name.includes(kw);c.classList.toggle('hide',!show);if(show)visible++;});
  if(kw&&visible===0)toast('未找到相关商品');
}
document.getElementById('searchBtn').addEventListener('click',doSearch);
document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});

/* v15 纯展示页：底部 Tab 栏为展示用 div（无 href），点击不跳转，故省略导航事件 */

const ptr=document.getElementById('ptr'),scroll=document.getElementById('scroll');let startY=0,pull=0;
scroll.addEventListener('touchstart',e=>{if(scroll.scrollTop===0)startY=e.touches[0].clientY;});
scroll.addEventListener('touchmove',e=>{if(startY&&scroll.scrollTop===0){pull=e.touches[0].clientY-startY;if(pull>0&&pull<90){ptr.classList.add('show');ptr.style.height=pull+'px';}}});
scroll.addEventListener('touchend',()=>{if(pull>50){ptr.style.height='46px';setTimeout(()=>{ptr.classList.remove('show');ptr.style.height='';toast('已更新 3 个特价');},900);}else{ptr.classList.remove('show');ptr.style.height='';}startY=0;pull=0;});

// 同步购物车角标（基于 localStorage）；v15 纯展示页无角标元素时跳过
(function(){
  if(!badge)return;
  const total=cart.reduce((s,c)=>s+c.qty,0);
  badge.textContent=total;
  badge.classList.toggle('hide',total===0);
})();

/* ===== 背景改造：把局部渐变层高度对齐到轮播 Banner 下沿 =====
   渐变从页面顶部开始，到 banner 底部正好收成 #FFFFFF，往下全白。
   （`.phone` 内互不滚动，直接量 banner 相对 phone 的位置即可） */
function fitTopBg(){
  const tb=document.getElementById('topBg'),ph=document.getElementById('phone'),bw=document.getElementById('bannerWrap'),sc=document.getElementById('scroll');
  if(!tb||!ph||!bw)return;
  const pr=ph.getBoundingClientRect(),br=bw.getBoundingClientRect();
  const h=br.bottom-pr.top+(sc?sc.scrollTop:0);
  if(h>0)tb.style.height=Math.round(h)+'px';
}
requestAnimationFrame(fitTopBg);
window.addEventListener('load',fitTopBg);
window.addEventListener('resize',fitTopBg);

setTimeout(()=>{document.getElementById('skeleton').classList.add('hide');},1300);
</script>
