<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>粤食采 · 司机工作台</title>
<style>
  :root{
    --bg:#F1FAF1;
    --white:#fff;
    --green:#34ac40;
    --green-dark:#2A8E34;
    --green-light:#E8F5E9;
    --ink:#1A231B;
    --sub:#7B8A7C;
    --line:#EDF2ED;
    --orange:#F59E0B;
    --blue:#2E9BD6;
    --red:#E53935;
    --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:#e9efe9;color:var(--ink);font-size:14px;line-height:1.5;
    display:flex;align-items:center;justify-content:center;min-height:100vh;
  }
  .phone{
    position:relative;width:375px;height:812px;margin:0 auto;
    background:var(--white);overflow:hidden;
    box-shadow:0 0 40px rgba(0,0,0,.08);
    display:flex;flex-direction:column;
  }

  /* 状态栏：淡绿头部 → 深色图标 */
  .statusbar{
    height:44px;display:flex;align-items:center;justify-content:space-between;
    padding:0 18px;font-size:13px;font-weight:600;
    background:transparent;color:var(--ink);position:absolute;top:0;left:0;right:0;z-index:20;
  }
  .statusbar .right{display:flex;gap:5px;align-items:center}
  .statusbar svg{display:block}

  /* 淡绿头部 */
  .top{
    flex:none;padding:56px 18px 18px;
    background:linear-gradient(180deg,#F1FAF1 0%,#E8F5E9 60%,#FFFFFF 100%);
    position:relative;
  }
  .top::after{content:'';position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(52,172,64,.06);top:-40px;right:-40px;}
  .top-inner{position:relative;z-index:1}
  .top-title{font-size:20px;font-weight:800;letter-spacing:.5px}
  .top-sub{font-size:12px;color:var(--sub);margin-top:3px}

  /* 内容滚动区 */
  .container{flex:1;overflow-y:auto;padding:0 16px 24px;-webkit-overflow-scrolling:touch}

  /* 司机信息卡（含供应商区域） */
  .driver-card{
    position:relative;z-index:2;background:var(--white);border-radius:var(--radius);
    border:1px solid var(--line);box-shadow:0 8px 24px rgba(28,56,32,.06);
    padding:16px;
  }
  .driver-top{display:flex;align-items:flex-start;justify-content:space-between}
  .driver-id-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .driver-name{font-size:17px;font-weight:700}
  .driver-phone{font-size:13px;color:var(--sub);margin-top:4px;letter-spacing:.5px}
  .status-tag{
    display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;
    font-size:12px;font-weight:600;
  }
  .status-tag.normal{background:rgba(52,172,64,.12);color:var(--green-dark)}
  .status-tag.abnormal{background:rgba(229,57,53,.12);color:#C62828}
  .status-tag.unfilled{background:rgba(120,120,120,.12);color:#777}
  .driver-alert-red{
    display:none;align-items:flex-start;gap:6px;margin-top:12px;
    padding:10px 12px;border-radius:10px;background:rgba(229,57,53,.08);
    color:var(--red);font-size:12.5px;line-height:1.45;
  }
  .driver-alert-red svg{width:15px;height:15px;flex:none;margin-top:1px}
  .top-actions{display:flex;align-items:center;gap:8px;}
  .qr-btn{
    width:40px;height:40px;border-radius:12px;flex:none;
    background:var(--green-light);display:flex;align-items:center;justify-content:center;
    color:var(--green);border:none;cursor:pointer;
  }
  .qr-btn svg{width:20px;height:20px;display:block}

  /* 分隔线 */
  .driver-divider{height:1px;background:var(--line);margin:16px 0 12px;border:none}

  /* 未填写资料：快速入驻 */
  .quick-entry-wrap{display:none;margin-top:14px}
  .btn-primary-full{
    width:100%;height:46px;border-radius:23px;border:none;cursor:pointer;text-decoration:none;
    background:linear-gradient(135deg,var(--green),var(--green-dark));
    color:#fff;font-size:15px;font-weight:700;font-family:inherit;
    display:flex;align-items:center;justify-content:center;gap:6px;
    box-shadow:0 6px 16px rgba(52,172,64,.32);
  }
  .btn-primary-full:active{transform:translateY(1px)}
  .btn-primary-full svg{width:18px;height:18px}
  .quick-entry-tip{font-size:12px;color:var(--sub);text-align:center;margin-top:10px;line-height:1.5}

  /* 供应商区域（合并在内） */
  .supplier-section{cursor:pointer}
  .sc-title{font-size:15px;font-weight:700;margin-bottom:10px}
  .sc-main{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .sc-left{flex:1;min-width:0}
  .sc-count{font-size:14.5px;color:var(--ink);font-weight:600}
  .sc-warn{
    display:none;align-items:center;gap:4px;margin-top:6px;
    font-size:13px;color:var(--orange);line-height:1.4;
  }
  .sc-warn svg{width:14px;height:14px;flex:none}
  .sc-hint{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.45}
  .sc-arrow{
    width:28px;height:28px;border-radius:50%;background:var(--green-light);
    display:flex;align-items:center;justify-content:center;color:var(--sub);flex:none;
  }
  .sc-arrow svg{width:16px;height:16px}

  /* 供应商筛选下拉 */
  .filter-row{
    margin-top:14px;display:flex;align-items:center;justify-content:space-between;
    height:48px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 14px;
    cursor:pointer;position:relative;
  }
  .filter-label{font-size:14px;color:var(--sub);white-space:nowrap}
  .filter-value{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ink);}
  .filter-value svg{width:14px;height:14px;color:var(--sub);flex:none}
  .dropdown-options{
    display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);
    background:#fff;border:1px solid var(--line);border-radius:12px;
    box-shadow:0 8px 24px rgba(0,0,0,.08);z-index:60;overflow:hidden;
  }
  .dropdown-options.show{display:block}
  .dropdown-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer;
  }
  .dropdown-item:last-child{border-bottom:none}
  .dropdown-item:active{background:var(--bg)}
  .tag-unbound{
    display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;
    background:rgba(120,120,120,.10);color:#777;font-size:10.5px;
  }

  /* 订单模块 */
  .order-section{margin-top:14px}
  .order-tabs{
    display:flex;border-bottom:1px solid var(--line);background:#fff;
  }
  .order-tab{
    flex:1;height:42px;display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:600;color:var(--sub);border:none;background:transparent;
    cursor:pointer;position:relative;font-family:inherit;
  }
  .order-tab.active{color:var(--green)}
  .order-tab.active::after{
    content:'';position:absolute;bottom:0;left:20%;right:20%;height:3px;
    background:var(--green);border-radius:2px;
  }
  .order-list{margin-top:12px;display:flex;flex-direction:column;gap:10px}
  .order-card{
    background:var(--white);border:1px solid var(--line);border-radius:14px;padding:28px 14px;
    cursor:pointer;text-align:center;color:var(--sub);font-size:14px;
  }
  .empty{text-align:center;color:var(--sub);font-size:13px;padding:40px 0}

  /* 底部 Tab（本期暂不展示） */
  .tabbar{
    display:none;
  }
  .tabbar .tab-itm{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-size:11px;color:var(--sub);cursor:pointer;
  }
  .tabbar .tab-itm.active{color:var(--green)}
  .tabbar .tab-itm svg{width:22px;height:22px;display:block}

  /* 右下角调试面板 */
  .debug{position:absolute;right:12px;bottom:72px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .debug-fab{width:46px;height:46px;border-radius:50%;background:var(--green);color:#fff;border:none;font-size:12px;font-weight:700;box-shadow:0 4px 14px rgba(52,172,64,.4);cursor:pointer;font-family:inherit}
  .debug-fab:active{transform:scale(.96)}
  .debug-panel{display:none;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 8px 30px rgba(0,0,0,.18);width:210px}
  .debug-panel.open{display:flex}
  .debug-title{font-size:12px;color:var(--sub);margin-bottom:2px}
  .debug-panel button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 10px;font-size:13px;text-align:left;cursor:pointer;font-family:inherit}
  .debug-panel button:hover{background:var(--bg)}
  .debug-panel button.active{background:rgba(52,172,64,.12);border-color:var(--green);color:var(--green-dark);font-weight:600}

  /* 弹窗（二维码） */
  .modal{
    position:absolute;inset:0;background:rgba(26,35,27,.5);z-index:40;
    display:none;align-items:center;justify-content:center;
  }
  .modal.show{display:flex}
  .modal-box{
    width:260px;background:#fff;border-radius:18px;padding:22px 20px 18px;text-align:center;position:relative;
  }
  .modal-box .close{
    position:absolute;top:12px;right:14px;width:24px;height:24px;border-radius:50%;
    background:var(--green-light);color:var(--sub);border:none;font-size:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .modal-box .m-title{font-size:15px;font-weight:700;margin-bottom:2px}
  .modal-box .m-sub{font-size:12px;color:var(--sub);margin-bottom:14px}
  .qr-code{width:170px;height:170px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}
  .qr-code svg{width:100%;height:100%;display:block}
  .qr-info{font-size:12px;color:var(--sub);margin-top:12px}
  .qr-info b{color:var(--ink)}

  /* Toast */
  .toast{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    background:rgba(33,48,31,.9);color:#fff;padding:10px 18px;border-radius:22px;
    font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:opacity .3s;
    max-width:280px;text-align:center;
  }
  .toast.show{opacity:1}
</style>
</head>
<body>

];

var selectedFilter='全部合作供应商';
var curTab='待配送';

var ORDERS=[
  {shop:'佛山南海桂城餐厅',status:'待配送'},
  {shop:'顺德大良酒楼',status:'待配送'},
  {shop:'佛山南海桂城餐厅',status:'进行中'},
  {shop:'东莞南城食堂',status:'已完成'},
  {shop:'顺德大良酒楼',status:'已取消'}
];

/* ============ DOM ============ */
var driverName=document.getElementById('driverName');
var driverPhone=document.getElementById('driverPhone');
var driverTag=document.getElementById('driverTag');
var driverAlert=document.getElementById('driverAlert');
var driverDivider=document.getElementById('driverDivider');
var quickEntryWrap=document.getElementById('quickEntryWrap');
var supplierCount=document.getElementById('supplierCount');
var supplierWarn=document.getElementById('supplierWarn');
var supplierSection=document.getElementById('supplierSection');
var topActions=document.getElementById('topActions');
var workSection=document.getElementById('workSection');
var orderSection=document.getElementById('orderSection');
var filterRow=document.getElementById('filterRow');
var filterText=document.getElementById('filterText');
var dropdownOptions=document.getElementById('dropdownOptions');
var orderTabs=document.getElementById('orderTabs');
var orderList=document.getElementById('orderList');
var toastEl=document.getElementById('toast'),toastTimer=null;
var qrModal=document.getElementById('qrModal');
var qrBtn=document.getElementById('qrBtn');
var settingsBtn=document.getElementById('settingsBtn');
var debugPanel=document.getElementById('debugPanel');
var debugFab=document.getElementById('debugFab');

/* ============ 工具函数 ============ */
function fmtPhone(p){return p.replace(/(\d{3})(\d{4})(\d{4})/,'$1 $2 $3');}
function toast(msg){
  toastEl.textContent=msg;toastEl.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastEl.classList.remove('show');},1800);
}

/* ============ 状态渲染 ============ */
function renderState(){
  var cfg=stateConfig[demoState];

  // 调试按钮高亮（所有状态通用）
  document.querySelectorAll('#debugPanel button').forEach(function(btn){
    btn.classList.toggle('active', +btn.dataset.state===demoState);
  });

  /* ---------- 状态4 · 未填写资料（手动跳过填写） ---------- */
  if(demoState===4){
    driverName.textContent='未填写资料';
    driverTag.className='status-tag unfilled';
    driverTag.textContent='未入驻';
    driverPhone.textContent=fmtPhone(driverInfo.phone);
    driverAlert.style.display='none';
    topActions.style.display='none';
    driverDivider.style.display='none';
    quickEntryWrap.style.display='block';
    supplierSection.style.display='none';
    workSection.style.display='none'; // 隐藏配送列表模块
    return;
  }

  /* ---------- 状态1/2/3 正常逻辑 ---------- */
  var isAbnormal=cfg.driverStatus==='abnormal';

  driverName.textContent=driverInfo.name;
  driverPhone.textContent=fmtPhone(driverInfo.phone);
  topActions.style.display='flex';
  driverDivider.style.display='block';
  quickEntryWrap.style.display='none';
  supplierSection.style.display='block';

  if(isAbnormal){
    driverTag.className='status-tag abnormal';
    driverTag.textContent='账号：异常';
    driverAlert.style.display='flex';
  }else{
    driverTag.className='status-tag normal';
    driverTag.textContent='账号：正常';
    driverAlert.style.display='none';
  }

  // 合作供应商
  var total=cfg.suppliers.length;
  var hasAnomaly=cfg.suppliers.some(function(s){return s.status==='pending'||s.status==='rejected';});
  supplierCount.textContent='共 '+total+' 家合作供应商';
  supplierWarn.style.display=hasAnomaly?'flex':'none';

  // 工作区显隐：状态1/2/3 均展示筛选供应商 + 订单模块
  workSection.style.display='block';
  orderSection.style.display='block';

  // 默认重置选中全部
  selectedFilter='全部合作供应商';
  filterText.textContent=selectedFilter;
  curTab='待配送';
  document.querySelectorAll('#orderTabs .order-tab').forEach(function(t){t.classList.remove('active');});
  document.querySelector('#orderTabs .order-tab[data-tab="待配送"]').classList.add('active');

  renderOrders();
}

/* ============ 供应商下拉选项渲染 ============ */
function renderDropdown(){
  dropdownOptions.innerHTML=allFilterOptions.map(function(opt){
    var tag='';
    if(opt.status==='unbound') tag='<span class="tag-unbound">已解除绑定</span>';
    else if(opt.status==='pending') tag='<span class="tag-unbound" style="background:rgba(245,158,11,.12);color:#B26A00">审核中</span>';
    else if(opt.status==='approved') tag='<span class="tag-unbound" style="background:rgba(52,172,64,.12);color:var(--green-dark)">正常</span>';
    return '<div class="dropdown-item" data-name="'+opt.name+'"><span>'+opt.name+'</span>'+tag+'</div>';
  }).join('');
}

/* ============ 订单渲染（占位） ============ */
function renderOrders(){
  var list=ORDERS.filter(function(o){
    var okTab=o.status===curTab;
    var okFilter=selectedFilter==='全部合作供应商'||o.shop===selectedFilter;
    return okTab&&okFilter;
  });
  if(!list.length){
    orderList.innerHTML='<div class="empty">暂无相关订单</div>';
    return;
  }
  orderList.innerHTML=list.map(function(o){
    return '<div class="order-card" data-shop="'+o.shop+'">订单卡片（详情待开发）</div>';
  }).join('');
}

/* ============ 二维码 ============ */
function genQR(){
  var n=21,cell=100/n,rects='';
  for(var y=0;y<n;y++)for(var x=0;x<n;x++){
    if(Math.random()>0.5)rects+='<rect x="'+(x*cell).toFixed(2)+'" y="'+(y*cell).toFixed(2)+'" width="'+cell.toFixed(2)+'" height="'+cell.toFixed(2)+'"/>';
  }
  function finder(ox,oy){
    return '<rect x="'+(ox*cell).toFixed(2)+'" y="'+(oy*cell).toFixed(2)+'" width="'+(7*cell).toFixed(2)+'" height="'+(7*cell).toFixed(2)+'" fill="#1A231B"/>'
      +'<rect x="'+((ox+1)*cell).toFixed(2)+'" y="'+((oy+1)*cell).toFixed(2)+'" width="'+(5*cell).toFixed(2)+'" height="'+(5*cell).toFixed(2)+'" fill="#fff"/>'
      +'<rect x="'+((ox+2)*cell).toFixed(2)+'" y="'+((oy+2)*cell).toFixed(2)+'" width="'+(3*cell).toFixed(2)+'" height="'+(3*cell).toFixed(2)+'" fill="#1A231B"/>';
  }
  return '<svg viewBox="0 0 100 100" fill="#1A231B"><rect width="100" height="100" fill="#fff"/>'+rects+finder(0,0)+finder(n-7,0)+finder(0,n-7)+'</svg>';
}
qrBtn.addEventListener('click',function(){
  document.getElementById('qrName').textContent=driverInfo.name;
  document.getElementById('qrPhone').textContent=driverInfo.phone;
  document.getElementById('qrCode').innerHTML=genQR();
  qrModal.classList.add('show');
});
document.getElementById('qrClose').addEventListener('click',function(){qrModal.classList.remove('show');});
qrModal.addEventListener('click',function(e){if(e.target===qrModal)qrModal.classList.remove('show');});

settingsBtn.addEventListener('click',function(){
  toast('设置：跳转编辑资料页（演示）');
});

/* ============ 供应商区域点击 ============ */
supplierSection.addEventListener('click',function(){
  toast('当前绑定供应商列表（二期迭代）');
});

/* ============ 供应商筛选交互 ============ */
filterRow.addEventListener('click',function(e){
  if(e.target.closest('.dropdown-options'))return;
  dropdownOptions.classList.toggle('show');
});
dropdownOptions.addEventListener('click',function(e){
  var item=e.target.closest('.dropdown-item');if(!item)return;
  selectedFilter=item.dataset.name;
  filterText.textContent=selectedFilter;
  dropdownOptions.classList.remove('show');
  renderOrders();
});
document.addEventListener('click',function(e){
  if(!e.target.closest('#filterRow')) dropdownOptions.classList.remove('show');
});

/* ============ 订单 Tab 交互 ============ */
orderTabs.addEventListener('click',function(e){
  var tab=e.target.closest('.order-tab');if(!tab)return;
  document.querySelectorAll('#orderTabs .order-tab').forEach(function(t){t.classList.remove('active');});
  tab.classList.add('active');
  curTab=tab.dataset.tab;
  renderOrders();
});

/* ============ 订单卡片点击 ============ */
orderList.addEventListener('click',function(e){
  var card=e.target.closest('.order-card');if(!card)return;
  toast('订单详情（二期迭代）');
});

/* ============ 右下角调试面板 ============ */
debugFab.addEventListener('click',function(e){e.stopPropagation();debugPanel.classList.toggle('open');});
debugPanel.addEventListener('click',function(e){
  var btn=e.target.closest('button');if(!btn)return;
  demoState=+btn.dataset.state;
  debugPanel.classList.remove('open');
  renderState();
});
document.addEventListener('click',function(e){if(!e.target.closest('.debug')&&debugPanel.classList.contains('open'))debugPanel.classList.remove('open');});

/* ============ 底部 Tab ============ */
document.querySelectorAll('#tabbar .tab-itm').forEach(function(it){
  it.addEventListener('click',function(){
    var name=it.textContent.trim();
    if(it.classList.contains('active'))return;
    toast(name+' 页待设计');
  });
});

/* ============ 初始化 ============ */
renderDropdown();
renderState();
</script>
</body>
</html>
