<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>粤食采 · 我的</title>
<style>
  :root{
    --bg:#F1FAF1;
    --white:#fff;
    --green:#34ac40;
    --green-light:#E8F5E9;
    --green-dark:#2A8E34;
    --red:#E53935;
    --ink:#1A231B;
    --sub:#7B8A7C;
    --line:#EDF2ED;
    --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#F1FAF1;color:var(--ink);font-size:14px;line-height:1.5}
  .phone{position:relative;width:375px;margin:0 auto;background:transparent;height:812px;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.08);display:flex;flex-direction:column}

  /* status bar */
  .statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:13px;font-weight:600;background:transparent;color:#fff;position:absolute;top:0;left:0;right:0;z-index:10}
  .statusbar .right{display:flex;gap:5px;align-items:center}
  .statusbar svg{display:block}

  /* profile header */
  .profile-header{flex:none;background:linear-gradient(135deg,#34ac40 0%,#2A8E34 100%);padding:96px 16px 36px;position:relative;overflow:hidden;color:#fff}
  .profile-header::before,.profile-header::after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
  .profile-header::before{width:120px;height:120px;top:-30px;right:-20px}
  .profile-header::after{width:80px;height:80px;bottom:20px;left:40px}
  .profile-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
  .profile-user{display:flex;align-items:center;gap:12px;flex:1;min-width:0;margin-right:16px}
  .avatar{width:58px;height:58px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:#fff;overflow:hidden;flex:none}
  .avatar img{width:100%;height:100%;display:block;object-fit:contain}
  .profile-info{flex:1;min-width:0}
  .phone-num{font-size:18px;font-weight:800;margin-bottom:4px}
  .company-tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:rgba(255,255,255,.22);padding:4px 10px;border-radius:12px;max-width:100%;min-width:0;white-space:nowrap;overflow:hidden}
  .company-tag svg{width:12px;height:12px;flex:none}
  .company-tag .cname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .service{display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff;font-size:11px;position:relative;z-index:1}
  .service svg{width:24px;height:24px}

  /* capsule */
  .capsule{position:absolute;top:44px;right:12px;display:flex;align-items:center;border:1px solid rgba(255,255,255,.5);border-radius:16px;overflow:hidden;background:rgba(255,255,255,.15);height:30px;padding:0 4px;z-index:11}
  .capsule .dot{width:34px;height:100%;display:flex;align-items:center;justify-content:center;gap:2.5px}
  .capsule .dot i{width:3.5px;height:3.5px;border-radius:50%;background:#fff}
  .capsule .sep{width:1px;height:18px;background:rgba(255,255,255,.3)}
  .capsule .min{width:34px;height:100%;display:flex;align-items:center;justify-content:center}
  .capsule .min i{width:12px;height:1.5px;background:#fff;border-radius:1px}
  .capsule .close{width:34px;height:100%;display:flex;align-items:center;justify-content:center}
  .capsule .close i{width:12px;height:12px;border:1.5px solid #fff;border-radius:50%}

  /* content */
  .profile-content{flex:1;overflow-y:auto;padding:12px 12px 90px}
  .profile-content::-webkit-scrollbar{display:none}
  .card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px}
  .card-title{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:12px}
  .grid{display:flex;flex-wrap:wrap}
  .grid-item{width:25%;display:flex;flex-direction:column;align-items:center;padding:10px 4px;text-align:center;box-sizing:border-box}
  .grid-item svg{width:26px;height:26px;color:var(--green);margin-bottom:6px;flex:none}
  .grid-item .name{font-size:12px;color:var(--ink);line-height:1.3;word-break:break-all}

  /* map section */
  .warehouse{margin-bottom:8px}
  .warehouse .name{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:6px}
  .map-box{height:130px;border-radius:10px;overflow:hidden;background:#E8F1E8;position:relative;border:1px solid var(--line)}
  .map-box img{width:100%;height:100%;object-fit:cover;display:block}
  .map-pin{position:absolute;top:50%;left:50%;transform:translate(-50%,-100%);width:28px;height:36px}
  .map-pin svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}

  /* supplier certificates */
  .cert-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .cert-grid .cert:first-child:last-child{grid-column:span 2;justify-self:center;width:50%}
  .cert{border-radius:10px;overflow:hidden;background:#FAFCFA;border:1px solid var(--line);padding:6px}
  .cert img{width:100%;height:auto;display:block;border-radius:6px}
  .cert-caption{font-size:11px;color:var(--sub);text-align:center;margin-top:6px}

  /* tech footer */
  .tech-footer{padding:20px 0 10px;text-align:center;color:#9DB39D;font-size:12px}
  .tech-footer .brand{font-size:13px;letter-spacing:.3px}

  /* tabbar */
  .tabbar{position:absolute;bottom:0;left:0;right:0;height:64px;background:#fff;display:flex;z-index:40;border-top:1px solid var(--line)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--sub);font-size:10.5px;position:relative;text-decoration:none}
  .tab svg{width:22px;height:22px}
  .tab.on{color:var(--green)}
  .tab .badge{position:absolute;top:4px;right:calc(50% - 17px);background:var(--red);color:#fff;font-size:9px;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;font-weight:700}

  /* toast */
  .toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(33,48,31,.9);color:#fff;padding:10px 18px;border-radius:22px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:opacity .3s}
  .toast.show{opacity:1}

  /* skeleton */
  .skeleton{position:absolute;inset:0;background:#F1FAF1;z-index:60;padding:16px;display:flex;flex-direction:column}
  .sk{background:linear-gradient(90deg,#e0e9e0 25%,#eef3ee 37%,#e0e9e0 63%);background-size:400% 100%;animation:sh 1.4s infinite;border-radius:10px}
  @keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
  .sk-row{display:flex;gap:11px;margin-bottom:12px}
  .sk-card{height:90px;flex:1}
  .hide{display:none!important}
</style>
</head>
<body>

<script>
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400);}
